name: Personal Raycast
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tooling/raycast-setup/**"
      - "shared/**"
      - "bin/raycast-setup"
      - "script-commands/**"
      - "extensions/todoist/**"
      - "extensions/local-search/**"
      - "extensions/parallels-virtual-machines/**"
      - ".github/workflows/personal-raycast-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tooling
            shared
            bin
            script-commands
            extensions/todoist
            extensions/local-search
            extensions/parallels-virtual-machines
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test --test-concurrency=1 tooling/raycast-setup/tests/setup.test.mjs
      - name: Check extensions sequentially
        shell: bash
        run: |
          set -euo pipefail
          for extension in todoist local-search parallels-virtual-machines; do
            (
              cd "extensions/$extension"
              npm ci --no-audit --no-fund
              if [ "$extension" = local-search ]; then npm test; else npm test -- --maxWorkers=1; fi
              npm run lint
              if [ "$extension" = todoist ]; then npm run test:focus; fi
              npm run build
              npm run typecheck
            )
          done
